[project]
name = "jobsearch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "valkey>=6",
    "httpx>=0.27",
    "selectolax>=0.3",
    "fastapi>=0.115",
    "pydantic>=2",
    "sentence-transformers>=3",
    "argon2-cffi>=23",
    "sentry-sdk>=2.15",
    "anthropic>=1",
    "playwright>=1.45",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

# The backend is not an installable package: page folders (auth, profiles,
# results, sources) and library/ sit directly in backend/ and are imported
# with backend/ as the working directory.
[tool.uv]
package = false

# Tests live in the repository-level tests/ folder, next to backend/ and frontend/.
[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
