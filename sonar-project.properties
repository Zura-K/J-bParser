sonar.projectKey=j-bparser
sonar.projectName=J-bParser

sonar.sources=backend,frontend
sonar.tests=tests,frontend
sonar.test.inclusions=tests/**/*.py,frontend/**/*.test.ts,frontend/**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/__pycache__/**,backend/.venv/**,frontend/dist/**,frontend/coverage/**,frontend/package-lock.json,backend/uv.lock,frontend/**/*.test.ts,frontend/**/*.test.tsx

sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.exclusions=tests/**,frontend/**/*.test.ts,frontend/**/*.test.tsx
