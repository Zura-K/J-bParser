server {
    listen 80 default_server;
    server_name _;

    # Never reveal the nginx version.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # No directory listings, ever.
    autoindex off;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Block any dotfile lookups (.env, .git, .htaccess, ...) outright.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Resolve the backend container through Docker's embedded DNS at request
    # time. A literal proxy_pass hostname is resolved once at nginx startup,
    # so a recreated backend container (new IP) would 502 until nginx restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API goes to the backend container; nothing else is proxied.
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets are immutable — cache them hard, 404 anything unknown.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Serve the compiled SPA; unknown paths fall back to index.html
    # (client-side routing), never to the filesystem.
    location / {
        try_files $uri /index.html;
    }
}
