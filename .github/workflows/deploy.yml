name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DEPLOY_HOST: "62.171.154.9"
  DEPLOY_PATH: /opt/jbparser/app

jobs:
  test_backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install_valkey_compatible_server
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: install_uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: run_tests
        working-directory: backend
        run: |
          uv sync
          uv run pytest --cov=. --cov-report=xml

      - name: upload_backend_coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend_coverage
          path: backend/coverage.xml

  test_frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # package-lock.json is authored with npm 11; pin the runner's npm to the
      # same major so `npm ci` here and the node:22-alpine production build
      # resolve it identically (npm 10 and 11 write incompatible lock formats).
      - name: pin_npm
        run: npm install -g npm@11

      - name: install_dependencies
        working-directory: frontend
        run: npm ci

      - name: lint
        working-directory: frontend
        run: npm run lint

      - name: test
        working-directory: frontend
        run: npm test

      - name: upload_frontend_coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend_coverage
          path: frontend/coverage/lcov.info

      - name: build
        working-directory: frontend
        run: npm run build

